name: Instagram Scraper CI

on:
  push:
    branches:
      - main

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'  # เลือก version ตามต้องการ

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set APIFY_TOKEN
        run: echo "APIFY_TOKEN=${{ secrets.APIFY_TOKEN }}" >> $GITHUB_ENV

      - name: Run app
        run: |
          gunicorn app:app --bind 0.0.0.0:8000
