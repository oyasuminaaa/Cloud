services:
  - type: web
    name: instagram-scraper
    env: python
    plan: free
    region: singapore
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: |
      gunicorn app:app --workers=1 --threads=1 --timeout=120
    envVars:
      - key: APIFY_TOKEN
        sync: false
    healthCheckPath: /healthz
