<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Instagram Data Results</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h2>ผลลัพธ์ Instagram</h2>
    {% if data %}
        <table>
            <tr>
                <th>Page Name</th>
                <th>Text</th>
                <th>Post URL</th>
                <th>Post Date</th>
            </tr>
            {% for item in data %}
            <tr>
                <td>{{ item['Page Name'] }}</td>
                <td>{{ item['Text'] }}</td>
                <td><a href="{{ item['Post URL'] }}" target="_blank">{{ item['Post URL'] }}</a></td>
                <td>{{ item['Post Date'] }}</td>
            </tr>
            {% endfor %}
        </table>
    {% else %}
        <p>ไม่พบข้อมูล</p>
    {% endif %}
</body>
</html>
