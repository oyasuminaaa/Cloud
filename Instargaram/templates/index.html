<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instagram Scraper via Apify</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 2rem; }
    textarea, input, button { width: 100%; padding: .75rem; margin-top: .5rem; box-sizing: border-box; }
    .container { max-width: 720px; margin: 0 auto; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 1rem 1.25rem; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .mt { margin-top: 1rem; }
    .muted { color: #555; font-size: .9rem; }
    a.button { display:inline-block; padding:.75rem 1rem; border-radius:10px; border:1px solid #ddd; text-decoration:none; }
  </style>
</head>
<body>
<div class="container">
  <h1>Instagram Scraper (Apify)</h1>
  <p class="muted">วาง URL โปรไฟล์/โพสต์ของ Instagram (1 บรรทัดต่อ 1 URL) และกำหนดจำนวนผลลัพธ์ต่อ URL</p>
  <div class="card">
    <form id="scrapeForm">
      <label>URLs (บรรทัดละ 1 รายการ)</label>
      <textarea name="urls" rows="8" placeholder="https://www.instagram.com/natgeo&#10;https://www.instagram.com/instagram"></textarea>
      <div class="row mt">
        <div>
          <label>Results limit ต่อ URL</label>
          <input name="results_limit" type="number" min="1" max="100" value="40">
        </div>
      </div>
      <button class="mt" type="submit">ดึงข้อมูล</button>
    </form>
    <div id="result" class="mt"></div>
  </div>
</div>

<script>
const form = document.getElementById('scrapeForm');
const result = document.getElementById('result');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  result.textContent = 'กำลังดึงข้อมูล...';
  const formData = new FormData(form);
  try {
    const res = await fetch('/pull', { method: 'POST', body: formData });

    // เปลี่ยนตรงนี้
    const html = await res.text();   // รับเป็น text
    result.innerHTML = html;         // แสดง HTML table ใน div #result

  } catch (err) {
    result.textContent = '❌ อั้ย!!! ' + err.message;
  }
});
</script>
</body>
</html>
