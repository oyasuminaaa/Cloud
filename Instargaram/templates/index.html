<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Instagram Posts</title>
</head>
<body>
<h1>Instagram Posts</h1>

<form action="/pull" method="post">
    <textarea name="urls" rows="5" cols="50" placeholder="ใส่ URL ของ Instagram"></textarea><br>
    <input type="number" name="results_limit" value="40">
    <button type="submit">ดึงข้อมูล</button>
</form>

<h2>Posts:</h2>
<ul>
    {% for post in posts %}
    <li>
        <strong>{{ post.page_name }}</strong>: {{ post.text }} <br>
        <a href="{{ post.post_url }}" target="_blank">Link</a> | {{ post.post_date }}
    </li>
    {% endfor %}
</ul>
</body>
</html>
