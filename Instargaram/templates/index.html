<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>Instagram Scraper</title>
</head>
<body>
  <h1>Instagram Posts</h1>
  <form method="post" action="/pull">
    <textarea name="urls" placeholder="ใส่ลิงก์ Instagram (1 บรรทัดต่อ 1 ลิงก์)" rows="4" cols="50"></textarea><br>
    <input type="number" name="results_limit" value="40">
    <button type="submit">ดึงข้อมูล</button>
  </form>
  <h2>โพสต์ล่าสุด</h2>
  <ul>
    {% for post in posts %}
      <li>
        <a href="{{ post.post_url }}" target="_blank">{{ post.page_name }}</a><br>
        {{ post.text }} <br>
        <small>{{ post.post_date }}</small>
      </li>
    {% endfor %}
  </ul>
  <a href="/download">📥 ดาวน์โหลด CSV</a>
</body>
</html>
